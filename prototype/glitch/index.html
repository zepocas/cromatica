<!doctype html>
<meta charset="utf-8" />
<title>glitch prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 12px system-ui; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ui { position: absolute; bottom: 8px; left: 8px; background: #000b; padding: 8px 10px; border-radius: 6px; display: grid; grid-template-columns: auto 120px 40px; gap: 1px 8px; align-items: center; z-index: 2; }
  #ui label.wide { grid-column: 1 / 4; }
  .tag { position: absolute; background: #000a; padding: 2px 6px; border-radius: 4px; z-index: 1; white-space: nowrap; }
</style>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
// Throwaway prototype: boundary-reactive glitch as a stateless per-pixel stage.
// Every pixel reads only the pattern at a few nearby points (the neighbour stage, D46) plus hashes of
// its own cell, so tiling stays exact. "Animate" only reshuffles the hash seed to explore looks.
const MODES = [
  ['0 split', 'channels pulled apart along the edge'],
  ['1 split + corrupt', 'outline fringe, row jitter, patches, scanlines'],
  ['2 mosh', 'pixelated, bit-crushed, recolored blocks'],
  ['3 split + mosh', 'blocks with fringed edges'],
  ['4 all three', 'split, mosh and corrupt stacked'],
  ['5 corrupt', 'row jitter, patches, scanlines, bit crush'],
];
const P = { strength: 0.6, edgeStep: 0.01, gain: 6, thresh: 0.4, rows: 70, cells: 28, fringe: 0.035, reach: 0.015, anomaly: 0.25, seed: 1, sharp: 0.5, palette: 0 };
const RANGES = { strength: [0, 1, 0.01], edgeStep: [0.002, 0.04, 0.001], gain: [1, 20, 0.5], thresh: [0, 1, 0.01], rows: [10, 200, 1], cells: [6, 80, 1], fringe: [0, 0.1, 0.001], reach: [0, 0.1, 0.002], anomaly: [0, 1, 0.01], seed: [0, 99, 1], sharp: [0, 1, 0.01], palette: [0, 2, 1] };
let animate = false, split = true, single = 3;

const frag = `precision highp float;
uniform vec4 box; // x0,y0,w,h in pixels
uniform float mode, strength, edgeStep, gain, thresh, rows, cells, fringe, reach, anomaly, seed, sharp, palette;
float gSplit=0., gMosh=0.;
float h11(float n){ return fract(sin(n*127.1+seed*311.7)*43758.5453); }
float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7))+seed*74.7)*43758.5453); }
vec2 h22(vec2 p){ return vec2(h21(p),h21(p+31.7)); }
float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
// Pattern noise must not depend on the glitch seed, or the seed would change the base image.
float ph(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float pn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(ph(i),ph(i+vec2(1,0)),f.x),mix(ph(i+vec2(0,1)),ph(i+vec2(1,1)),f.x),f.y); }
float fld(vec2 p){ return pn(p*1.7)*.6+pn(p*3.9+4.)*.3+pn(p*8.+9.)*.1; }
vec3 ramp(float t){
  t=clamp(t,0.,1.)*4.;
  vec3 a,b,c,d,e;
  if(palette<.5){ a=vec3(.05,.07,.25); b=vec3(.45,.1,.55); c=vec3(.95,.3,.35); d=vec3(1.,.75,.4); e=vec3(.98,.95,.85); }
  else if(palette<1.5){ a=vec3(.02,.12,.18); b=vec3(.0,.45,.5); c=vec3(.5,.8,.7); d=vec3(.95,.9,.6); e=vec3(.95,.45,.3); }
  else { a=vec3(.9,.9,.85); b=vec3(.15,.2,.4); c=vec3(.9,.25,.2); d=vec3(.1,.1,.12); e=vec3(.95,.8,.3); }
  return t<1.?mix(a,b,t):t<2.?mix(b,c,t-1.):t<3.?mix(c,d,t-2.):mix(d,e,t-3.);
}
// Stand-in pattern: warped noise field through a palette, partly posterized so there are both soft
// gradients and color boundaries, like the real designs.
vec3 pat(vec2 p){
  vec2 q=p+.35*vec2(pn(p*2.+1.7)-.5,pn(p*2.+8.3)-.5);
  float t=fld(q*1.3);
  t=(t-.2)/.6;
  float s=t*3.;
  t=mix(t,(floor(s)+smoothstep(.35,.65,fract(s)))/3.,sharp);
  return ramp(t);
}
// xy = unit gradient direction (toward lighter), z = edge strength 0..1.5
vec3 edgeAt(vec2 p){
  float e=edgeStep;
  vec3 dx=pat(p+vec2(e,0.))-pat(p-vec2(e,0.));
  vec3 dy=pat(p+vec2(0.,e))-pat(p-vec2(0.,e));
  float m=sqrt(dot(dx,dx)+dot(dy,dy))/(2.*e)*0.05*gain;
  vec2 g=vec2(dot(dx,vec3(.3,.6,.1)),dot(dy,vec3(.3,.6,.1)));
  vec2 dir=length(g)>1e-5?normalize(g):vec2(1.,0.);
  return vec3(dir, smoothstep(thresh,thresh+.35,m)*min(m,1.5));
}
vec3 split3(vec2 p,float k){
  vec3 ed=edgeAt(p); vec2 off=ed.xy*ed.z*fringe*strength*3.*k;
  return vec3(pat(p+off).r, pat(p).g, pat(p-off).b);
}
vec3 samp(vec2 p){ return gSplit>.5?split3(p,1.):pat(p); }
vec2 tearOff(vec2 p){
  float y=p.y+.05*(pn(vec2(p.x*1.3,p.y*2.)+seed)-.5)+.02*sin(p.x*7.+p.y*5.);
  float band=floor(y*rows); float h=h11(band);
  vec2 c=vec2(p.x,(band+.5)/rows);
  float e=edgeAt(c).z;
  float on=step(.35,h11(band+91.));
  return vec2((h-.5)*2.*e*on*strength*.5, 0.);
}
vec3 smearTear(vec2 p, float k){
  vec2 off=tearOff(p); vec3 acc=vec3(0.);
  for(int i=0;i<6;i++) acc+=split3(p+off*float(i)/5.,k);
  return acc/6.;
}
float luma(vec3 c){ return dot(c,vec3(.3,.6,.1)); }
// Edge zone: strongest edge within "reach" of p, so artifacts spread a little beyond the boundary line.
float zoneAt(vec2 p){
  float z=edgeAt(p).z;
  z=max(z,edgeAt(p+vec2(reach,0.)).z); z=max(z,edgeAt(p-vec2(reach,0.)).z);
  z=max(z,edgeAt(p+vec2(0.,reach)).z); z=max(z,edgeAt(p-vec2(0.,reach)).z);
  return z;
}
vec3 anomaly3(vec3 c,float k){
  k=floor(k*4.);
  return k<1.?c.bgr:k<2.?1.-c:k<3.?c.gbr:vec3(luma(c))*vec3(1.2,.4,1.1);
}
// Compression-style corruption: blocks of two sizes near boundaries are pixelated, shifted, bit-crushed
// and sometimes recolored.
vec3 mosh(vec2 p){
  float sc=h21(floor(p*cells*.5))>.5?cells*.5:cells;
  vec2 id=floor(p*sc); vec2 q=(id+.5)/sc;
  float zq=zoneAt(q);
  float on=step(.2,zq)*step(.5,h21(id+5.));
  vec2 pp=mix(p,q,on)+on*vec2((h21(id+2.)-.5)*.06*strength,0.);
  vec3 c=samp(pp);
  if(on>.5){
    if(h21(id+77.)<anomaly) c=anomaly3(c,h21(id+9.));
    c=floor(c*5.+.5)/5.;
  }
  return c;
}
// Pixel-sort-like streaks: the brightest color within a run to the side wins, so bright shapes smear
// out of their boundaries; run length and direction are hashed per row.
vec3 sortAt(vec2 p){
  float z=zoneAt(p);
  float row=floor(p.y*rows);
  float len=strength*.35*smoothstep(.1,.5,z)*(.3+h11(row))*(h11(row+5.)>.5?1.:-1.);
  vec3 best=pat(p); float bl=luma(best);
  for(int i=1;i<=14;i++){
    vec3 c=pat(p+vec2(len*float(i)/14.,0.)); float l=luma(c);
    if(l>bl){best=c;bl=l;}
  }
  return best;
}
vec3 base(vec2 p){ return gMosh>.5?mosh(p):samp(p); }
// Everything at once, the digital version: per-row independent channel jitter, rectangular
// anomaly patches, scanlines and bit crush, all gated to the boundary zone.
vec3 corrupt(vec2 p){
  float z=zoneAt(p);
  float row=floor(p.y*rows*1.5);
  float amp=z*strength*.09*step(.4,h11(row+40.));
  vec3 c=vec3(base(p+vec2((h11(row)-.5)*amp,0.)).r, base(p).g, base(p+vec2((h11(row+13.)-.5)*amp,0.)).b);
  vec2 pid=floor(p*vec2(cells*.7,rows*.2));
  if(z>.25 && h21(pid)<anomaly*.6) c=anomaly3(c,h21(pid+3.));
  c*=1.-.14*step(.5,fract(p.y*rows*1.5))*smoothstep(.1,.4,z);
  return mix(c,floor(c*6.+.5)/6.,step(.45,z));
}
vec3 echoAt(vec2 p){
  vec3 ed=edgeAt(p);
  float k=floor(pn(p*5.+seed*5.)*4.)-1.;
  vec2 off=ed.xy*ed.z*k*strength*.05;
  return base(p+off);
}
void main(){
  vec2 px=gl_FragCoord.xy-box.xy;
  if(px.x<0.||px.y<0.||px.x>box.z||px.y>box.w){discard;}
  vec2 p=px/box.w;
  vec3 col;
  gSplit=(mode<1.5||(mode>2.5&&mode<4.5))?1.:0.; gMosh=(mode>1.5&&mode<4.5)?1.:0.;
  if(mode<.5) col=samp(p);
  else if(mode<1.5) col=corrupt(p);
  else if(mode<2.5) col=mosh(p);
  else if(mode<3.5) col=mosh(p);
  else if(mode<4.5) col=corrupt(p);
  else { gSplit=0.; gMosh=0.; col=corrupt(p); }
  gl_FragColor=vec4(pow(clamp(col,0.,1.),vec3(1./1.0)),1.);
}`;
const vert = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';

const cv = document.getElementById('c');
const gl = cv.getContext('webgl');
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { document.title = 'ERR ' + gl.getShaderInfoLog(o); throw new Error(gl.getShaderInfoLog(o)); } return o; }
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vert)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(pr); gl.useProgram(pr);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(pr, n);

const ui = document.getElementById('ui');
for (const k of Object.keys(P)) {
  const [mn, mx, st] = RANGES[k];
  ui.insertAdjacentHTML('beforeend', `<span>${k}</span><input type=range id=s_${k} min=${mn} max=${mx} step=${st} value=${P[k]}><span id=v_${k}>${P[k]}</span>`);
  ui.querySelector('#s_' + k).oninput = e => { P[k] = +e.target.value; ui.querySelector('#v_' + k).textContent = P[k]; };
}
ui.insertAdjacentHTML('beforeend', `<label class=wide><input type=checkbox id=anim> animate seed</label><label class=wide><input type=checkbox id=split checked> compare all (keys 0-5 for one)</label>`);
ui.querySelector('#anim').onchange = e => animate = e.target.checked;
ui.querySelector('#split').onchange = e => split = e.target.checked;
addEventListener('keydown', e => { if (e.key === 'h') ui.style.display = ui.style.display === 'none' ? '' : 'none'; if ('012345'.includes(e.key) && e.key) { single = +e.key; ui.querySelector('#split').checked = split = false; } if (e.key === ' ') { ui.querySelector('#split').checked = split = true; } });
const tags = MODES.map(m => { const d = document.createElement('div'); d.className = 'tag'; d.textContent = m[0] + ' — ' + m[1]; document.body.append(d); return d; });

const params = new URLSearchParams(location.search); if (params.has('hide')) ui.style.display = 'none';
for (const [k, v] of params) { if (k in P) { P[k] = +v; ui.querySelector('#s_' + k).value = v; ui.querySelector('#v_' + k).textContent = v; } if (k === 'single') { single = +v; split = false; ui.querySelector('#split').checked = false; } }

let t0 = performance.now();
function draw(now) {
  const dpr = devicePixelRatio || 1;
  const W = cv.width = Math.round(innerWidth * dpr), H = cv.height = Math.round(innerHeight * dpr);
  if (animate) { P.seed = Math.floor((now - t0) / 140) % 100; ui.querySelector('#s_seed').value = P.seed; ui.querySelector('#v_seed').textContent = P.seed; }
  gl.clearColor(.07, .07, .07, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  for (const k of Object.keys(P)) gl.uniform1f(U(k), P[k]);
  const cw = split ? W / 3 : W, ch = split ? H / 2 : H;
  const list = split ? MODES.map((_, i) => i) : [single];
  list.forEach((mode, i) => {
    const cx = split ? i % 3 : 0, cy = split ? 1 - Math.floor(i / 3) : 0;
    gl.uniform1f(U('mode'), mode);
    gl.uniform4f(U('box'), cx * cw, cy * ch, cw, ch);
    gl.viewport(0, 0, W, H); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    const tg = tags[mode]; tg.style.display = 'block';
    tg.style.left = ((cx + 1) * cw / dpr - tg.offsetWidth - 8) + 'px'; tg.style.top = ((H - (cy + 1) * ch) / dpr + 8) + 'px';
  });
  if (!split) tags.forEach((t, i) => { if (i != single) t.style.display = 'none'; });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
