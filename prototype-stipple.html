<!doctype html>
<!-- PROTOTYPE (throwaway): stippled ink-blobs look. Run `npm run dev`, open /prototype-stipple.html?variant=A -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROTOTYPE stipple blobs</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #222;
        color: #eee;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0 280px 0 0;
        display: grid;
        place-items: center;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
      }
      #panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 280px;
        box-sizing: border-box;
        padding: 12px;
        background: #111;
        overflow: auto;
      }
      #panel label {
        display: grid;
        grid-template-columns: 90px 1fr 40px;
        gap: 6px;
        align-items: center;
        margin: 4px 0;
      }
      #panel h4 {
        margin: 14px 0 4px;
        color: #999;
        font-weight: 600;
      }
      #panel button {
        margin-top: 8px;
      }
      #switcher {
        position: fixed;
        bottom: 16px;
        left: calc(50% - 140px);
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 14px;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font-weight: 600;
        box-shadow: 0 4px 20px rgb(0 0 0 / 0.5);
      }
      #switcher button {
        border: 0;
        background: #000;
        color: #fff;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="c"></canvas></div>
    <div id="panel"></div>
    <script type="module" src="/prototype/stipple/main.ts"></script>
  </body>
</html>
